# Production stack for the internal VM (uses the shared homelab-postgres, database `medicore`). Everything is bound to 127.0.0.1;
# Cloudflare Tunnel is the only way in. Secrets live in deploy/.env (not committed).
name: medicore
services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://medicore:${DB_PASSWORD}@homelab-postgres:5432/medicore
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${WEB_ORIGIN}
      WEB_APP_URL: ${WEB_ORIGIN}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      EMAIL_TRANSPORT: console
    ports: ["127.0.0.1:3101:3001"]
    networks: [default, homelab_database]

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${API_ORIGIN}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:3100:3000"]

networks:
  # Existing homelab Postgres; MediCore gets its own database and role there.
  homelab_database:
    external: true
