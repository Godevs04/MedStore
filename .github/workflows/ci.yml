name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages and Prisma client
        run: |
          pnpm --filter @medicore/shared-types --filter @medicore/validation run build
          pnpm --filter @medicore/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicore
          POSTGRES_DB: medicore_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U medicore -d medicore_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://medicore@localhost:5433/medicore_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and migrate
        run: |
          pnpm --filter @medicore/shared-types --filter @medicore/validation run build
          pnpm --filter @medicore/api exec prisma generate
          pnpm --filter @medicore/api run build
          pnpm --filter @medicore/api run db:migrate
      - run: pnpm test:integration
